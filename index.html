<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifas El Patrón</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460, #533483);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* LOGO + TITULO */
.logo {
  font-size: 2.5em;
  font-weight: bold;
  margin-top: 20px;
  animation: glow 2s infinite alternate;
}

/* CARD 3D */
.card {
  margin: 20px;
  padding: 25px;
  border-radius: 20px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  transform: perspective(1000px) rotateX(5deg);
  transition: 0.5s;
}

.card:hover {
  transform: perspective(1000px) rotateX(0deg) scale(1.05);
}

/* IMAGEN */
.car {
  width: 100%;
  border-radius: 15px;
  transition: 0.5s;
}

.car:hover {
  transform: scale(1.1);
}

/* BOTÓN */
button {
  margin-top: 15px;
  padding: 15px 30px;
  border: none;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  color: white;
  background: linear-gradient(45deg, #ff00cc, #3333ff);
  box-shadow: 0 0 20px #ff00cc;
  animation: pulse 1.5s infinite;
}

button:hover {
  transform: scale(1.1);
}

/* STICKERS */
.sticker {
  position: absolute;
  font-size: 2.5em;
  animation: float 4s infinite ease-in-out;
}

.s1 { top: 10%; left: 10%; }
.s2 { top: 20%; right: 10%; }
.s3 { bottom: 15%; left: 15%; }
.s4 { bottom: 20%; right: 10%; }

/* BANCO */
.bank {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
}

/* ANIMACIONES */
@keyframes float {
  0% {transform: translateY(0);}
  50% {transform: translateY(-15px);}
  100% {transform: translateY(0);}
}

@keyframes glow {
  from {text-shadow: 0 0 10px #ff00cc;}
  to {text-shadow: 0 0 25px #00ffff;}
}

@keyframes pulse {
  0% {box-shadow: 0 0 10px #ff00cc;}
  50% {box-shadow: 0 0 30px #ff00cc;}
  100% {box-shadow: 0 0 10px #ff00cc;}
}
</style>

</head>
<body>

<!-- STICKERS -->
<div class="sticker s1">🔥</div>
<div class="sticker s2">💸</div>
<div class="sticker s3">🇲🇽</div>
<div class="sticker s4">🚗</div>

<!-- LOGO -->
<div class="logo">👑 Rifas El Patrón 👑</div>

<div class="card">

  <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a" class="car">

  <h2>🚗 Toyota 2026</h2>

  <p>💰 Número: $100 MXN</p>
  <p>🏆 1er lugar: Toyota 2026</p>
  <p>🥈 $20,000</p>
  <p>🥉 $10,000</p>

  <button onclick="comprar()">🔥 Comprar número</button>

  <div class="bank" id="bank">
    <h3>🏦 Pago</h3>
    <p>Santander</p>
    <p>Cuenta: 1234567890</p>
    <p>CLABE: 000000000000</p>
  </div>

</div>

<script>
function comprar(){
  document.getElementById("bank").style.display = "block";
  let numero = prompt("🎟️ Elige tu número:");

  if(numero){
    alert("🔥 Elegiste el número " + numero);
  }
}
</script>

</body>
</html>
