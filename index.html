<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifas El Patrón</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #e9f7ef, #198754);
  text-align: center;
}

h1 {
  color: #0f5132;
  margin-top: 20px;
}

.card {
  background: white;
  margin: 20px;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  animation: fadeIn 1s ease;
}

button {
  background: #198754;
  color: white;
  border: none;
  padding: 15px 25px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #145c32;
  transform: scale(1.1);
}

.bank {
  background: #fff3cd;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
  display: none;
}

@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}
</style>

</head>
<body>

<h1>🇲🇽 Rifas El Patrón 🌵</h1>

<div class="card">
  <h2>🚗 Toyota 2026</h2>

  <p>💰 Número: <strong>$100 MXN</strong></p>

  <p>🏆 1er lugar: Camioneta Toyota 2026</p>
  <p>🥈 2do lugar: $20,000</p>
  <p>🥉 3er lugar: $10,000</p>

  <button onclick="mostrarPago()">🔥 Comprar número</button>

  <div class="bank" id="bank">
    <h3>🏦 Datos de pago</h3>
    <p>Banco: Santander</p>
    <p>Cuenta: 1234567890</p>
    <p>CLABE: 000000000000000000</p>
    <p>📲 Envía tu comprobante por WhatsApp</p>
  </div>
</div>

<script>
function mostrarPago(){
  document.getElementById("bank").style.display = "block";
}
</script>

</body>
</html>
