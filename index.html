<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rifas El Patrón</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(180deg, #0f172a, #1e293b);
    color: white;
}

/* HEADER /
.header {
    text-align: center;
    padding: 20px;
}

.logo {
    width: 120px;
    border-radius: 50%;
    box-shadow: 0 0 20px gold;
}

h1 {
    font-size: 36px;
    margin: 10px 0;
}

/ TARJETA PRINCIPAL /
.card {
    width: 90%;
    max-width: 400px;
    margin: auto;
    background: linear-gradient(145deg, #1e3a5f, #334155);
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

/ IMAGEN CARRO /
.carro-img {
    width: 100%;
    border-radius: 20px;
}

/ TEXTO /
.title {
    text-align: center;
    font-size: 24px;
    margin: 15px 0;
}

.info {
    text-align: center;
    margin: 10px 0;
    font-size: 18px;
}

/ BOTÓN /
.btn {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    font-size: 20px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(90deg, #ff00cc, #3333ff);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff00cc;
}

/ EFECTOS /
.money {
    position: fixed;
    top: -50px;
    font-size: 25px;
    animation: caer 6s linear infinite;
}

@keyframes caer {
    100% { transform: translateY(100vh); }
}

/ STICKERS */
.sticker {
    position: fixed;
    font-size: 30px;
    animation: flotar 4s infinite;
}

@keyframes flotar {
    50% { transform: translateY(-15px); }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <!-- TU LOGO (sube tu logo como logo.png al repo) -->
    <img src="logo.png" class="logo">
    <h1>👑 Rifas El Patrón 👑</h1>
    🇲🇽 🇲🇽 🇲🇽
</div>

<!-- TARJETA -->
<div class="card">

    <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a" class="carro-img">

    <div class="title">🚗 Toyota 2026</div>

    <div class="info">💰 Número: $100 MXN</div>
    <div class="info">🏆 1er lugar: Toyota 2026</div>
    <div class="info">🥈 $20,000</div>
    <div class="info">🥉 $10,000</div>

    <button class="btn">🔥 Comprar número</button>

</div>

<!-- REGALOS -->
<div style="text-align:center; font-size:40px; margin-top:20px;">
🎁 🎁 🎁
</div>

<!-- DINERO -->
<div class="money" style="left:10%;">💸</div>
<div class="money" style="left:40%;">💸</div>
<div class="money" style="left:70%;">💸</div>

<!-- STICKERS -->
<div class="sticker" style="left:5%; top:40%;">🤠</div>
<div class="sticker" style="right:5%; top:50%;">💰</div>
<div class="sticker" style="left:10%; bottom:10%;">🎟️</div>

</body>
</ht
